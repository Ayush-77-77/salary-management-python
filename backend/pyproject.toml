[project]
name = "employee-salary-api"
version = "0.1.0"
description = "HR employee and salary tracking API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.163.1",
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (style problems)
    "F",   # pyflakes (unused imports, undefined names: real bugs)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (use modern Python syntax)
    "B",   # flake8-bugbear (common bug patterns)
    "SIM", # flake8-simplify (simpler equivalent code)
]
